name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push database migrations
        run: supabase db push --db-url "${{ secrets.SUPABASE_DB_URL }}"

      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy scan-pass --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy admin-daily-pass-action --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
          supabase functions deploy bulk-import-students --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Sync function secrets (WhatsApp gateway, site URL)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase secrets set \
            ULTRAMSG_INSTANCE_ID="${{ secrets.ULTRAMSG_INSTANCE_ID }}" \
            ULTRAMSG_TOKEN="${{ secrets.ULTRAMSG_TOKEN }}" \
            SITE_URL="${{ secrets.SITE_URL }}" \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
